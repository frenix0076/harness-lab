name: harness-review
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Clean install
        run: npm ci
      - name: Deterministic verification
        run: npm run verify
      - name: Validate headless caller syntax without credentials
        run: node scripts/run-ticket.mjs TCK-123 --dry-run
